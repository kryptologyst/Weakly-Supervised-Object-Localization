# @package _global_
defaults:
  - _self_
  - model: resnet50
  - data: imagenet
  - training: default
  - evaluation: default
  - visualization: default

# Project configuration
project:
  name: "weakly-supervised-object-localization"
  version: "1.0.0"
  description: "Advanced Computer Vision: Weakly Supervised Object Localization"

# Paths
paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  checkpoints_dir: "checkpoints"
  logs_dir: "logs"
  assets_dir: "assets"

# Device configuration
device: "auto"  # auto, cuda, mps, cpu
mixed_precision: true
compile_model: false

# Reproducibility
seed: 42
deterministic: true

# Logging
logging:
  level: "INFO"
  log_every_n_steps: 10
  save_every_n_epochs: 5
  use_wandb: false
  use_tensorboard: true

# Hydra configuration
hydra:
  run:
    dir: logs/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
  sweep:
    dir: logs/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
